<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101c"/>
      <stop offset="55%" stop-color="#1a1630"/>
      <stop offset="100%" stop-color="#221a3d"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20242e"/>
      <stop offset="100%" stop-color="#1a1d26"/>
    </linearGradient>
    <linearGradient id="lidEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a3f4d"/>
      <stop offset="50%" stop-color="#5a6070"/>
      <stop offset="100%" stop-color="#3a3f4d"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#3d4350"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8257e6"/>
      <stop offset="100%" stop-color="#B69CF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8257e6" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8257e6" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="laptopScreen"><rect x="222" y="212" width="812" height="486" rx="6"/></clipPath>
    <clipPath id="phoneScreen"><rect x="1176" y="336" width="268" height="516" rx="30"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <ellipse cx="800" cy="500" rx="700" ry="380" fill="url(#glow)"/>

  <!-- ============ HEADLINE ============ -->
  <text x="800" y="92" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="700" letter-spacing="-0.6">One vault. Every device.</text>
  <text x="800" y="132" text-anchor="middle" fill="#B69CF5" font-size="21" font-weight="500" letter-spacing="0.3">Desktop and mobile, synced in about a second, on a server you host</text>

