name: Release

# Triggered only by a bare SemVer tag (no `v` prefix), created by the owner.
# CI never creates tags and never publishes anywhere except GitHub Releases.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # --- Acceptance tests AT1–AT5 (plan 003) ---

      - name: AT1 — three-file artifact present
        working-directory: apps/obsidian-plugin
        run: |
          npm run build
          test -f main.js && test -f manifest.json && test -f styles.css || { echo FAIL; exit 1; }
          echo "PASS: three-file artifact present"

      - name: AT2 — tag == manifest.json.version == package.json.version
        working-directory: apps/obsidian-plugin
        run: |
          MANIFEST_V=$(node -p "require('./manifest.json').version")
          PKG_V=$(node -p "require('./package.json').version")
          [ "$MANIFEST_V" = "$PKG_V" ] || { echo "FAIL: manifest=$MANIFEST_V pkg=$PKG_V mismatch"; exit 1; }
          [ "$GITHUB_REF_NAME" = "$MANIFEST_V" ] || { echo "FAIL: tag=$GITHUB_REF_NAME manifest=$MANIFEST_V mismatch"; exit 1; }
          echo "PASS: tag and versions aligned at $MANIFEST_V"

      - name: AT3 — versions.json entry matches manifest minAppVersion
        run: |
          V=$(node -p "require('./apps/obsidian-plugin/manifest.json').version")
          MIN=$(node -p "require('./apps/obsidian-plugin/manifest.json').minAppVersion")
          GOT=$(node -p "require('./versions.json')['$V'] || ''")
          [ "$GOT" = "$MIN" ] || { echo "FAIL: versions.json['$V']=$GOT expected $MIN"; exit 1; }
          echo "PASS: versions.json entry matches manifest"

      - name: AT4 — manifest-beta.json consistent superset of manifest
        working-directory: apps/obsidian-plugin
        run: |
          test -f manifest-beta.json || { echo "FAIL: manifest-beta.json missing"; exit 1; }
          node -e "const m=require('./manifest.json'),b=require('./manifest-beta.json');
          for (const k of ['id','name','minAppVersion','isDesktopOnly']) if(m[k]!==b[k]){console.log('FAIL key',k);process.exit(1)}
          if(!b.version){console.log('FAIL: no version');process.exit(1)}
          console.log('PASS: manifest-beta consistent')"

      # AT5 and AT6 are the pre-publication privacy gates (plan 003): they must
      # be hard gates at release/tag time, scrubbing the repo before it (or a
      # tagged artifact of it) is made public. Detection patterns are
      # deliberately generic so this workflow never embeds any private value:
      # `tail[0-9a-f]{4,}\.ts\.net` catches real Tailscale-assigned tailnet
      # domains (e.g. `tail0123ab.ts.net`, a fabricated example) without matching documentation
      # placeholders like `your-tailnet.ts.net`; the 100.64.0.0/10 second-octet
      # range (64-127) catches CGNAT tailnet IPs; `192\.168\.` followed by two
      # numeric octets catches home LAN addresses in the RFC1918 192.168.0.0/16
      # range, while leaving redaction placeholders such as `192.168.x.n`
      # matchless because they carry no digits in the host octets.
      - name: AT5 — no secret markers in bundle
        working-directory: apps/obsidian-plugin
        run: |
          npm run build
          if grep -nE 'tail[0-9a-f]{4,}\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|refresh_token|BEGIN [A-Z]* PRIVATE KEY|invitation_secret' main.js; then
            echo "FAIL: secret-like content in bundle"; exit 1
          fi
          echo "PASS: no secret markers in main.js"

      - name: AT6 — no private-infra markers in publishable files
        run: |
          if grep -rInE 'tail[0-9a-f]{4,}\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|Documents/[^/]*Private|NOPASSWD|192\.168\.[0-9]{1,3}\.[0-9]{1,3}' \
            --include='*.md' --include='*.json' --include='*.ts' --include='*.mjs' --include='*.sh' --include='*.sql' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "REVIEW: matches found — must be scrubbed or justified before public tag"; exit 1
          fi
          echo "PASS: no private-infra markers in publishable files"

      - name: Create GitHub Release with three-file artifact
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/obsidian-plugin/main.js
            apps/obsidian-plugin/manifest.json
            apps/obsidian-plugin/styles.css
