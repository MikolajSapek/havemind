name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # --- Acceptance tests AT1–AT4 (plan 003); AT5–AT6 run in release.yml ---

      - name: AT1 — three-file artifact present
        working-directory: apps/obsidian-plugin
        run: |
          npm run build
          test -f main.js && test -f manifest.json && test -f styles.css || { echo FAIL; exit 1; }
          echo "PASS: three-file artifact present"

      - name: AT2 — manifest.json.version == package.json.version
        working-directory: apps/obsidian-plugin
        run: |
          MANIFEST_V=$(node -p "require('./manifest.json').version")
          PKG_V=$(node -p "require('./package.json').version")
          [ "$MANIFEST_V" = "$PKG_V" ] || { echo "FAIL: manifest=$MANIFEST_V pkg=$PKG_V mismatch"; exit 1; }
          echo "PASS: versions aligned at $MANIFEST_V"

      - name: AT3 — versions.json entry matches manifest minAppVersion
        run: |
          V=$(node -p "require('./apps/obsidian-plugin/manifest.json').version")
          MIN=$(node -p "require('./apps/obsidian-plugin/manifest.json').minAppVersion")
          GOT=$(node -p "require('./versions.json')['$V'] || ''")
          [ "$GOT" = "$MIN" ] || { echo "FAIL: versions.json['$V']=$GOT expected $MIN"; exit 1; }
          echo "PASS: versions.json entry matches manifest"

      - name: AT4 — manifest-beta.json consistent superset of manifest
        working-directory: apps/obsidian-plugin
        run: |
          test -f manifest-beta.json || { echo "FAIL: manifest-beta.json missing"; exit 1; }
          node -e "const m=require('./manifest.json'),b=require('./manifest-beta.json');
          for (const k of ['id','name','minAppVersion','isDesktopOnly']) if(m[k]!==b[k]){console.log('FAIL key',k);process.exit(1)}
          if(!b.version){console.log('FAIL: no version');process.exit(1)}
          console.log('PASS: manifest-beta consistent')"

      # AT5 (no secret markers in bundle) runs only at release/tag time in
      # release.yml, since it requires a full plugin build against the
      # tagged version.
      #
      # AT6 (no private-infra markers in publishable files) is a static grep
      # over source-controlled files, so it also runs here as a regression
      # guard (audit #3 finding 1): docs/plans must stay scrubbed of real
      # tailnet hostnames/IPs and home LAN addresses on every push, not just at
      # tag time. Keep this pattern identical to AT6 in release.yml.
      - name: AT6 — no private-infra markers in publishable files
        run: |
          if grep -rInE 'tail[0-9a-f]{4,}\.ts\.net|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}|Documents/[^/]*Private|NOPASSWD|192\.168\.[0-9]{1,3}\.[0-9]{1,3}' \
            --include='*.md' --include='*.json' --include='*.ts' --include='*.mjs' --include='*.sh' --include='*.sql' \
            --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "REVIEW: matches found — must be scrubbed or justified before public tag"; exit 1
          fi
          echo "PASS: no private-infra markers in publishable files"
